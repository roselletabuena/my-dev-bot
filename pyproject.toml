[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dev-bot"
version = "0.1.0"
description = "Polls Jira for ready tickets, has a coding agent implement them, and opens draft GitHub PRs."
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "requests-mock>=1.12",
]

[project.scripts]
dev-bot = "dev_bot.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dev_bot = ["prompts/*.md", "prompts/stages/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
